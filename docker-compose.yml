services:
  nexora:
    container_name: nexora
    build:
      context: .
      dockerfile: Dockerfile
    image: nexora:latest
    init: true
    restart: unless-stopped
    ports:
      - "${NEXORA_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://127.0.0.1:3000/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
